name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the revision guard below diffs against the previous commit
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: The page's revision number moves when the page does
        # pageVersion is hand-bumped, and a hand-bumped number is forgotten. It was: the
        # mixed board, the run breakdown and the sticky controls all shipped under Ver .01
        # because the bump is a separate act from the change. Aaron noticed before we did -
        # "I think it looks different, but I can't tell because the ver number didn't
        # increment" - which is exactly what the number is FOR. So the guard is mechanical.
        run: |
          set -euo pipefail
          if [ "$(git rev-list --count HEAD)" -lt 2 ]; then echo "shallow; skipping"; exit 0; fi
          if git diff --quiet HEAD~1 HEAD -- internal/server/page.go; then
            echo "page.go unchanged; no bump required"; exit 0
          fi
          before=$(git show HEAD~1:internal/server/page.go | grep -oE 'pageVersion = "[^"]*"' || true)
          after=$(grep -oE 'pageVersion = "[^"]*"' internal/server/page.go || true)
          echo "before: ${before:-<none>}"
          echo "after:  ${after:-<none>}"
          if [ "$before" = "$after" ]; then
            echo "::error::internal/server/page.go changed but pageVersion did not. A reader cannot tell the page updated."
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compiles for the Pi without cgo
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/sharect

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image name (GHCR requires lowercase)
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build linux/arm64 (pull request, not pushed)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: sharect:pr
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=pr-${{ github.event.number }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 (main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:sha-${{ steps.names.outputs.short }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=sha-${{ steps.names.outputs.short }}

      - name: Pick the image to smoke (the pushed :latest on main, the local build on a PR)
        id: smoke
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            image="${{ steps.names.outputs.image }}:latest"
            docker pull --platform linux/arm64 "$image"
          else
            image=sharect:pr
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # Runs the image exactly the way Will's compose entry does: arm64 under QEMU, UID/GID
      # 2000, read-only root, tmpfs /tmp, /data bind-mounted and owned by 2000, port 8080,
      # DATABASE_PATH as the only env. The four first-deploy failures from the hosting
      # handoff (arch, write outside /data, port, env) all fail here, not on the Pi.
      - name: Smoke — run as Will does
        env:
          IMAGE: ${{ steps.smoke.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p data && sudo chown 2000:2000 data
          docker run -d --name smoke --platform linux/arm64 --user 2000:2000 --read-only \
            --tmpfs /tmp -v "$PWD/data:/data" -p 8080:8080 \
            -e DATABASE_PATH=/data/leaderboard.db "$IMAGE"

          wait_ok() {
            for _ in $(seq 1 60); do
              if [ "$(curl -fsS localhost:8080/healthz 2>/dev/null || true)" = ok ]; then return 0; fi
              sleep 1
            done
            return 1
          }
          wait_ok || { echo "::error::/healthz never answered ok within 60 s"; exit 1; }
          echo "healthz: ok"

          board=$(curl -fsS localhost:8080/v1/board)
          echo "board: $board"
          [ "$board" = '{"source":"touch","window":"all","entries":[]}' ]

          page=$(curl -fsS localhost:8080/)
          # Assert what the page IS, not one exact string of its copy. This pinned the old
          # <title> and went red on the first change to it, then stayed red through five more
          # pushes while the image shipped anyway. A check nobody reads is worse than none.
          echo "$page" | grep -qF 'Share CT'
          echo "$page" | grep -qF 'BETA · MAY GO DOWN'
          echo "$page" | grep -qE 'Ver \.[0-9]+'
          echo "$page" | grep -q '/v1/board?source='

          code=$(curl -sS -o /dev/null -w '%{http_code}' localhost:8080/nope)
          [ "$code" = 404 ] || { echo "::error::GET /nope returned $code, want 404"; exit 1; }

          echo "container HEALTHCHECK command:"
          docker exec smoke /sharect -healthcheck

          docker logs smoke > first-boot.log 2>&1
          echo "--- first boot ---"; cat first-boot.log
          grep -q '"msg":"starting"' first-boot.log
          grep -q '"database_path":"/data/leaderboard.db"' first-boot.log
          grep -q '"msg":"migrations","applied":5,"from":0,"to":5' first-boot.log
          # Go on Linux reports the 0.0.0.0 wildcard as the dual-stack socket [::]:8080;
          # either spelling is "every interface, port 8080", which is what the tunnel needs.
          grep -Eq '"msg":"listening","addr":"(0\.0\.0\.0|\[::\]):8080"' first-boot.log
          test -f data/leaderboard.db

      # One player, one score, one board read, against the running container. The
      # attempt set is the parity fixture's "clean fast trial" (200/205/210 ms, no
      # misfires): the server must recompute it to 2100 (DIAMOND, 12.0 frames), refuse a
      # lied score, and treat a retried client_id as the same submission.
      - name: Smoke — register, submit, read the board
        run: |
          set -euo pipefail
          api=localhost:8080
          reg=$(curl -fsS -X POST "$api/v1/players" -H 'Content-Type: application/json' \
                -d '{"display_name":"Smoke","platform":"ios"}')
          echo "register: $reg"
          player=$(echo "$reg" | jq -er .player_id)
          token=$(echo "$reg" | jq -er .token)
          [ "${#token}" = 43 ]

          body='{"client_id":"smoke-1","source":"touch","best_ms":200,"avg_ms":205,"accuracy":1,"score":2100,"attempts_ms":[200,205,210],"misfires":0,"app_build":"ci","platform":"ios","device_model":"ci","device_label":"Touch"}'
          sub=$(curl -fsS -X POST "$api/v1/scores" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$body")
          echo "submit: $sub"
          [ "$(echo "$sub" | jq -r .rank)" = 1 ]
          [ "$(echo "$sub" | jq -r .board_size)" = 1 ]

          lied=$(echo "$body" | sed 's/"score":2100/"score":2101/')
          code=$(curl -sS -o lied.json -w '%{http_code}' -X POST "$api/v1/scores" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$lied")
          echo "lied score: $code $(cat lied.json)"
          [ "$code" = 422 ] && [ "$(jq -r .reason lied.json)" = score_mismatch ]

          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$api/v1/scores" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$body")
          [ "$code" = 200 ] || { echo "::error::retried client_id returned $code, want 200"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$api/v1/scores" -H 'Content-Type: application/json' -d "$body")
          [ "$code" = 401 ] || { echo "::error::no token returned $code, want 401"; exit 1; }

          # M1: the body is exactly the twelve declared keys; an undeclared one is refused.
          extra=$(echo "$body" | sed 's/"device_label":"Touch"/"device_label":"Touch","latitude":51.5/')
          code=$(curl -sS -o extra.json -w '%{http_code}' -X POST "$api/v1/scores" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$extra")
          echo "undeclared field: $code $(cat extra.json)"
          [ "$code" = 422 ] || { echo "::error::undeclared field returned $code, want 422"; exit 1; }
          [ "$(jq -r .reason extra.json)" = unknown_field ] || { echo "::error::undeclared field reason is $(jq -r .reason extra.json), want unknown_field"; exit 1; }

          board=$(curl -fsS "$api/v1/board?source=touch")
          echo "board: $board"
          [ "$(echo "$board" | jq -r '.entries | length')" = 1 ]
          [ "$(echo "$board" | jq -r '.entries[0].score')" = 2100 ]
          [ "$(echo "$board" | jq -r '.entries[0].best_ms')" = 200 ]
          [ "$(echo "$board" | jq -r '.entries[0].avg_ms')" = 205 ]
          [ "$(echo "$board" | jq -r '.entries[0].tier')" = DIAMOND ]
          [ "$(echo "$board" | jq -r '.entries[0].display_name')" = Smoke ]
          [ "$(curl -fsS "$api/v1/board?source=pad" | jq -r '.entries | length')" = 0 ]

          # M1: the row carries the winning submission's device and server-stamped time,
          # sort=score is accepted, and an unknown sort is a 400 rather than a fallback.
          [ "$(echo "$board" | jq -r '.entries[0].device_label')" = Touch ]
          echo "$board" | jq -r '.entries[0].created_at' | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          [ "$(curl -fsS "$api/v1/board?source=touch&sort=score" | jq -r '.entries[0].score')" = 2100 ]
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$api/v1/board?source=touch&sort=fastst")
          [ "$code" = 400 ] || { echo "::error::sort=fastst returned $code, want 400"; exit 1; }

          prof=$(curl -fsS "$api/v1/players/$player")
          echo "profile: $prof"
          [ "$(echo "$prof" | jq -r .submissions)" = 1 ]
          [ "$(echo "$prof" | jq -r .best.touch.score)" = 2100 ]

          # M1: an unknown player id on DELETE is 404 (already erased), never 500.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$api/v1/players/00000000-0000-4000-8000-000000000000" -H "Authorization: Bearer $token")
          [ "$code" = 404 ] || { echo "::error::DELETE of an unknown player returned $code, want 404"; exit 1; }

      # A restart proves the migrations are idempotent on a populated /data, that the
      # smoke's row survived in /data, and that SIGTERM drains cleanly (docker restart
      # sends SIGTERM, then SIGKILL after 10 s).
      - name: Smoke — restart is a no-op migration and a clean shutdown
        run: |
          set -euo pipefail
          docker restart --time 10 smoke
          for _ in $(seq 1 60); do
            if [ "$(curl -fsS localhost:8080/healthz 2>/dev/null || true)" = ok ]; then break; fi
            sleep 1
          done
          docker logs smoke > second-boot.log 2>&1
          echo "--- both boots ---"; cat second-boot.log
          grep -q '"msg":"shutting down"' second-boot.log
          grep -q '"msg":"stopped"' second-boot.log
          [ "$(grep -c '"msg":"migrations"' second-boot.log)" = 2 ]
          grep -q '"msg":"migrations","applied":0,"from":5,"to":5' second-boot.log
          [ "$(curl -fsS localhost:8080/healthz)" = ok ]
          [ "$(curl -fsS 'localhost:8080/v1/board?source=touch' | jq -r '.entries[0].score')" = 2100 ]

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs smoke 2>&1 || true
          docker rm -f smoke >/dev/null 2>&1 || true
